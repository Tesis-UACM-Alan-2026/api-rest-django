# SonarQube project configuration
sonar.projectKey=Almacen-General-Backend-UAM-UACM
sonar.projectName=Almacen General Backend UAM-UACM
sonar.projectVersion=1.0

# Source code configuration
sonar.sources=.
sonar.exclusions=**/migrations/**,**/venv/**,**/env/**,**/__pycache__/**,**/node_modules/**,**/*.pyc,**/static/**,**/media/**

# Python specific settings
sonar.python.version=3.8,3.9,3.10,3.11,3.12

# Test configuration
sonar.tests=.
sonar.test.inclusions=**/test_*.py,**/tests.py,**/*_test.py,**/tests/**/*.py
sonar.test.exclusions=**/migrations/**,**/venv/**,**/env/**

# Coverage reports (if you have them)
# sonar.python.coverage.reportPaths=coverage.xml

# Language configuration
sonar.language=py

# Organization (if using SonarCloud)
# sonar.organization=your-organization-key

# Coverage reports configuration
sonar.python.coverage.reportPaths=coverage.xml